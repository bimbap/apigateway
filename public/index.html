<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books App</title>
    <link href="https://cdn.datatables.net/1.10.24/css/dataTables.bootstrap4.min.css" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Books App</a>
        <button class="btn btn-primary btn-sm ml-auto" id="add-book-link" type="button">+ Add Book</button>
    </div>
</nav>

<div class="container mt-4">
    <div id="message"></div>
    <table id="books-table" class="table table-striped table-bordered" style="width:100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th style="width: 150px;">Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- Add Book Modal -->
<div class="modal fade" id="addBookModal" tabindex="-1" role="dialog" aria-labelledby="addBookModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addBookModalLabel">Add Book</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="add-book-form">
                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="submit-add-book">Add</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Book Modal -->
<div class="modal fade" id="editBookModal" tabindex="-1" role="dialog" aria-labelledby="editBookModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editBookModalLabel">Edit Book</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="edit-book-form">
                    <input type="hidden" id="edit-id">
                    <div class="form-group">
                        <label for="edit-title">Title:</label>
                        <input type="text" class="form-control" id="edit-title" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="submit-edit-book">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.10.24/js/dataTables.bootstrap4.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    function showAlert(type, text) {
        $('#message').html('<div class="alert alert-' + type + ' alert-dismissible fade show">' + text +
            '<button type="button" class="close" data-dismiss="alert">&times;</button></div>');
    }

    $(document).ready(function() {
        $.getJSON('/config', function(config) {
            const API_URL = (config && config.apiUrl || '').replace(/\/+$/, '');
            if (!API_URL) {
                showAlert('danger', 'API_URL is not configured in application environment.');
                return;
            }

            const table = $('#books-table').DataTable({
                "ajax": {
                    "url": API_URL,
                    "dataSrc": "",
                    "error": function(xhr) {
                        console.error('Error loading data:', xhr.responseText);
                        showAlert('danger', 'Failed to load data from API Gateway (check endpoint or CORS).');
                    }
                },
                "columns": [
                    { "data": "id" },
                    { "data": "title" },
                    {
                        "data": null,
                        "orderable": false,
                        "render": function(data, type, row) {
                            const safeTitle = $('<div>').text(row.title).html();
                            return '<button class="btn btn-warning btn-sm mr-1 btn-edit" data-id="' + row.id + '" data-title="' + safeTitle + '">Edit</button>' +
                                   '<button class="btn btn-danger btn-sm btn-delete" data-id="' + row.id + '">Delete</button>';
                        }
                    }
                ]
            });

            $('#add-book-link').click(function() {
                $('#title').val('');
                $('#addBookModal').modal('show');
            });

            $('#submit-add-book').click(function() {
                const title = $('#title').val().trim();
                if (!title) return showAlert('warning', 'Book title is required.');

                $.ajax({
                    url: API_URL,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ title }),
                    success: function() {
                        $('#addBookModal').modal('hide');
                        showAlert('success', 'Book added successfully!');
                        table.ajax.reload();
                    },
                    error: function(xhr) {
                        console.error(xhr.responseText);
                        showAlert('danger', 'Failed to add book (check API Gateway / CORS).');
                    }
                });
            });

            $('#books-table tbody').on('click', '.btn-edit', function() {
                $('#edit-id').val($(this).data('id'));
                $('#edit-title').val($(this).data('title'));
                $('#editBookModal').modal('show');
            });

            $('#submit-edit-book').click(function() {
                const id = $('#edit-id').val();
                const title = $('#edit-title').val().trim();
                if (!title) return showAlert('warning', 'Book title is required.');

                $.ajax({
                    url: API_URL + '/' + encodeURIComponent(id),
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ title }),
                    success: function() {
                        $('#editBookModal').modal('hide');
                        showAlert('success', 'Book updated successfully!');
                        table.ajax.reload();
                    },
                    error: function(xhr) {
                        console.error(xhr.responseText);
                        showAlert('danger', 'Failed to update book (check API Gateway / CORS).');
                    }
                });
            });

            $('#books-table tbody').on('click', '.btn-delete', function() {
                const id = $(this).data('id');
                if (!confirm('Delete this book?')) return;

                $.ajax({
                    url: API_URL + '/' + encodeURIComponent(id),
                    type: 'DELETE',
                    success: function() {
                        showAlert('success', 'Book deleted successfully!');
                        table.ajax.reload();
                    },
                    error: function(xhr) {
                        console.error(xhr.responseText);
                        showAlert('danger', 'Failed to delete book (check API Gateway / CORS).');
                    }
                });
            });
        }).fail(function() {
            showAlert('danger', 'Failed to load application configuration.');
        });
    });
</script>

</body>
</html>
